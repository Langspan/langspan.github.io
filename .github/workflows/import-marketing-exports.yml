name: Import reviewed marketing exports
on:
  push:
    branches: [design/marketing-asset-pipeline]
    paths: ['.github/workflows/import-marketing-exports.yml']
permissions:
  contents: write
  actions: read
jobs:
  import:
    if: github.repository == 'Langspan/langspan.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45726965079
          pattern: marketing-*
          path: /tmp/langspan-reviewed
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45727089617
          name: reviewed-social-preview
          path: /tmp/langspan-reviewed/reviewed-social-preview
      - name: Import only exact reviewed artifacts
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          manifest=json.loads(pathlib.Path('marketing/published-assets.json').read_text())
          root=pathlib.Path('/tmp/langspan-reviewed')
          for f in manifest['files']:
              source=root/f['source']
              assert hashlib.sha256(source.read_bytes()).hexdigest()==f['sha256'], source
          for f in manifest['files']:
              target=pathlib.Path(f['path'])
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(root/f['source'],target)
          print('All exact reviewed artifact hashes verified.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/coordination-demo.js assets/product/social-card.png assets/product/marketing
          git commit -m 'build: retain reviewed LangSpan marketing exports'
          git push origin HEAD:design/marketing-asset-pipeline
