name: Build product explorer bundle
on:
  push:
    branches: [design/product-explorer-v2]
    paths: ['demo-src/**', 'marketing/story.json', '.github/workflows/build-explorer.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'Langspan/langspan.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual vendored Stageshow
        working-directory: demo-src
        run: npm ci --ignore-scripts && npm run build
      - name: Record bundle provenance
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const path='marketing/published-assets.json',m=JSON.parse(fs.readFileSync(path,'utf8'));
          const f=m.files.find(x=>x.path==='assets/coordination-demo.js');
          if(!f)throw Error('bundle manifest missing');
          f.sha256=createHash('sha256').update(fs.readFileSync(f.path)).digest('hex');
          f.source='demo-src/CoordinationDemo.tsx and CapabilityExplorer.tsx (generated from marketing/story.json)';
          f.revision=process.env.GITHUB_SHA;
          fs.writeFileSync(path,JSON.stringify(m,null,2)+'\n');
          NODE
      - name: Commit generated bundle only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/coordination-demo.js marketing/published-assets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: generate versioned capability explorer bundle'
          git push origin HEAD:design/product-explorer-v2
