name: Import reviewed product proof
on:
  push:
    branches: [design/launch-readiness-v1]
    paths: ['.github/workflows/import-reviewed-proof.yml']
permissions:
  contents: write
  actions: read
jobs:
  import:
    if: github.repository == 'Langspan/langspan.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45724200921
          name: launch-binary-review
          path: /tmp/reviewed-proof
      - name: Check reviewed capture and commit exact bytes
        run: |
          cd /tmp/reviewed-proof
          echo '7daf31796a8207b89c0c2cdee70820b17b105fc6b064c53e3502c3cc547d6eb3  dashboard-independent.png' | sha256sum -c
          echo 'ff77ccede5f774eee49b192e6feb6f2f813e918fc585f43e1b9730f9df787609  dashboard-provenance.txt' | sha256sum -c
          cd "$GITHUB_WORKSPACE"
          mkdir -p assets/evidence
          cp /tmp/reviewed-proof/dashboard-independent.png assets/evidence/dashboard-v0.1.0.png
          cp /tmp/reviewed-proof/dashboard-provenance.txt assets/evidence/dashboard-v0.1.0.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/evidence/dashboard-v0.1.0.png assets/evidence/dashboard-v0.1.0.txt
          git commit -m 'docs: retain verified released dashboard capture'
          git push origin HEAD:design/launch-readiness-v1
